{% from "macros/ui.html" import btn, input %}
<tr id="user-row-{{ u.id }}" class="border-t border-border">
  <td class="py-2 pr-4">{{ u.email }}</td>
  <td class="py-2 pr-4 text-muted-foreground">{{ u.role }}</td>
  <td class="py-2 pr-4 font-medium" id="user-credits-{{ u.id }}">{{ u.credits }}</td>
  <td class="py-2">
    <form
      class="flex items-center gap-2"
      hx-post="/admin/users/{{ u.id }}/credits"
      hx-target="#user-row-{{ u.id }}"
      hx-swap="outerHTML"
    >
      <input
        type="number"
        name="credits"
        value="{{ u.credits }}"
        min="0"
        class="{{ input() }} h-8 w-24 px-2 py-1 text-sm"
      />
      <button type="submit" class="{{ btn('default', 'sm') }}">Đặt</button>
    </form>
  </td>
</tr>
