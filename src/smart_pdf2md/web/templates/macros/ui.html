{# Class-string macros mirroring shadcn buttonVariants / Card / Badge / Input.
   Return strings only — callers attach htmx attrs and choose <button> vs <a>. #}

{% macro btn(variant='default', size='default') -%}
{%- set base = 'inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50' -%}
{%- set variants = {
  'default': 'bg-primary text-primary-foreground hover:bg-primary/90',
  'outline': 'border border-input bg-background hover:bg-accent hover:text-accent-foreground',
  'secondary': 'bg-secondary text-secondary-foreground hover:bg-secondary/80',
  'ghost': 'hover:bg-accent hover:text-accent-foreground',
  'destructive': 'bg-destructive text-destructive-foreground hover:bg-destructive/90',
  'link': 'text-primary underline-offset-4 hover:underline',
} -%}
{%- set sizes = {
  'default': 'h-10 px-4 py-2',
  'sm': 'h-9 rounded-md px-3',
  'lg': 'h-11 rounded-md px-8',
  'icon': 'h-10 w-10',
} -%}
{{- base }} {{ variants.get(variant, variants['default']) }} {{ sizes.get(size, sizes['default']) -}}
{%- endmacro %}

{% macro card() -%}
rounded-lg border border-border bg-card text-card-foreground shadow-sm
{%- endmacro %}

{% macro card_header() -%}
flex flex-col space-y-1.5 p-6
{%- endmacro %}

{% macro card_title() -%}
text-2xl font-semibold leading-none tracking-tight
{%- endmacro %}

{% macro card_content() -%}
p-6 pt-0
{%- endmacro %}

{% macro input() -%}
flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50
{%- endmacro %}

{% macro badge(variant='default') -%}
{%- set base = 'inline-flex items-center rounded-md border px-2.5 py-0.5 text-xs font-semibold transition-colors focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2' -%}
{%- set variants = {
  'default': 'border-transparent bg-primary text-primary-foreground hover:bg-primary/80',
  'secondary': 'border-transparent bg-secondary text-secondary-foreground hover:bg-secondary/80',
  'destructive': 'border-transparent bg-destructive text-destructive-foreground hover:bg-destructive/80',
  'outline': 'text-foreground',
} -%}
{{- base }} {{ variants.get(variant, variants['default']) -}}
{%- endmacro %}

{% macro nav_link(href, label, active=false) -%}
{%- set base = 'rounded-md px-3 py-2 text-base font-medium transition-colors' -%}
{%- if active -%}
<a href="{{ href }}" class="{{ base }} bg-primary/10 text-primary" aria-current="page">{{ label }}</a>
{%- else -%}
<a href="{{ href }}" class="{{ base }} text-muted-foreground hover:bg-accent hover:text-foreground">{{ label }}</a>
{%- endif -%}
{%- endmacro %}
