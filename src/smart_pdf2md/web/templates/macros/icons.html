<!--
Credit coin icon (inline SVG).
Front-facing golden coin with a stylized "F" letter modeled after the FPT
Corporation logo (Phantom Digital / italic 13° with soft rounded terminals):
  * Horizontal bar ends are fully rounded (semicircular caps).
  * Stem top-left, bottom-left, bottom-right have rounded outer corners.
  * Inner corners at the bar/stem joins stay sharp.
The F is drawn upright then skewX(-13°) around the coin center for italic tilt.
-->
{% macro credit_coin(size=16, class="") -%}
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 32 32"
  width="{{ size }}"
  height="{{ size }}"
  class="shrink-0 {{ class }}"
  aria-hidden="true"
  focusable="false"
>
  <defs>
    <radialGradient id="cc-face" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0%" stop-color="#FFF3A0" />
      <stop offset="45%" stop-color="#FFD534" />
      <stop offset="100%" stop-color="#E89A0C" />
    </radialGradient>
    <linearGradient id="cc-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <circle cx="16" cy="16" r="14.5" fill="#A66610" />
  <circle cx="16" cy="16" r="13.2" fill="url(#cc-face)" />
  <circle cx="16" cy="16" r="11.4" fill="none" stroke="#E89A0C" stroke-width="0.7" opacity="0.7" />
  <path
    d="M6.5 12.8 A 9.5 9.5 0 0 1 13 6.3"
    stroke="url(#cc-shine)"
    stroke-width="2.2"
    stroke-linecap="round"
    fill="none"
  />

  <g
    transform="translate(16 16) skewX(-13) translate(-16.5 -16)"
    style="mix-blend-mode: multiply"
  >
    <path
      d="
        M 10 8.5
        A 1.5 1.5 0 0 1 11.5 7
        L 21.5 7
        A 1.5 1.5 0 0 1 21.5 10
        L 14.5 10
        L 14.5 14
        L 17.5 14
        A 1.5 1.5 0 0 1 17.5 17
        L 14.5 17
        L 14.5 23.5
        A 1.5 1.5 0 0 1 13 25
        L 11.5 25
        A 1.5 1.5 0 0 1 10 23.5
        Z
      "
      fill="#F37021"
      fill-opacity="0.7"
    />
  </g>
</svg>
{%- endmacro %}
