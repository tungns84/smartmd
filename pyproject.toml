[project]
name = "smart-pdf2md"
version = "0.1.0"
description = "Smart PDF to Markdown — pdf-inspector + OpenCode Go VLM / PaddleOCR"
authors = [
    { name = "tungns84", email = "tungnspfs@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pdf-inspector>=0.2.0",
    "typer>=0.12",
    "rich>=13.7",
    "pdf2image>=1.17",
    "requests>=2.32",
    "paddleocr>=3.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "rq>=1.16",
    "redis>=5.0",
    "argon2-cffi>=23.1",
    "pydantic-settings>=2.0",
    "itsdangerous>=2.2",
]

[project.scripts]
pdf2md-smart = "smart_pdf2md.cli:app"
pdf2md-web = "smart_pdf2md.web.__main__:main"
pdf2md-worker = "smart_pdf2md.web.worker:main"
pdf2md-admin = "smart_pdf2md.web.admin_cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "fakeredis>=2.23",
]

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "tests/web"]
addopts = "-q"
markers = [
    "db: cần PostgreSQL qua TEST_DATABASE_URL, skip khi thiếu",
    "integration: cần service thật (Postgres, Redis, worker), gate bằng biến môi trường",
    "slow: chạy lâu vì dùng fixture PDF lớn",
]

[tool.coverage.run]
source = ["src/smart_pdf2md"]
branch = true
omit = [
    "src/smart_pdf2md/cli.py",
    "src/smart_pdf2md/progress.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
